# Zephyr as a Jailhouse inmate on the Raspberry Pi 5 (with rpi5-jailhouse.overlay).
# The cell starts in non-secure EL1 with only RAM, the GIC and the timer.
CONFIG_ARMV8_A_NS=y

# Console through the Jailhouse debug-console hypercall
# (cell flag JAILHOUSE_CELL_VIRTUAL_CONSOLE_PERMITTED), read with "jailhouse console -f".
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_JAILHOUSE_DEBUG_CONSOLE=y

# Root-cell hardware
CONFIG_PCIE=n
CONFIG_GPIO=n
CONFIG_PINCTRL=n
CONFIG_ENTROPY_GENERATOR=n
